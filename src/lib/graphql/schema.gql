  phone: String
  """
  A comma separated list of tags that have been added to the customer.
  Additional access scope required: unauthenticated_read_customer_tags.
  
  """
  tags: [String!]!
  """The date and time when the customer information was updated."""
  updatedAt: DateTime!
}

